name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    # Services are ready for when tests/typecheck need a real database/queue.
    # services:
    #   postgres:
    #     image: postgres:16-alpine
    #     env:
    #       POSTGRES_USER: devdock
    #       POSTGRES_PASSWORD: devdock
    #       POSTGRES_DB: devdock
    #     ports:
    #       - 5432:5432
    #     options: >-
    #       --health-cmd "pg_isready -U devdock -d devdock"
    #       --health-interval 5s
    #       --health-timeout 3s
    #       --health-retries 5
    #   redis:
    #     image: redis:7-alpine
    #     ports:
    #       - 6379:6379
    #     options: >-
    #       --health-cmd "redis-cli ping"
    #       --health-interval 5s
    #       --health-timeout 3s
    #       --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # TODO: remove --legacy-peer-deps after resolving @types/node conflict with vitest
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

